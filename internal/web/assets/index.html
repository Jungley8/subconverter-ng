<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>subconverter-ng · 订阅链接转换与管理</title>
<style>
  :root {
    --bg: #f4f5fb;
    --bg-grad-a: #eef0fb;
    --bg-grad-b: #f7f3fb;
    --card: #ffffff;
    --card-subtle: #f8f9fd;
    --fg: #1c1d28;
    --muted: #6b6e80;
    --border: #e3e5ef;
    --field: #fafbff;
    --accent: #5b5bf0;
    --accent-fg: #ffffff;
    --accent-soft: #ecedff;
    --ok: #16a36a;
    --ok-soft: #ecfdf5;
    --warn: #d97706;
    --warn-soft: #fffbeb;
    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --shadow: 0 18px 50px -22px rgba(40, 40, 90, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f17;
      --bg-grad-a: #14131f;
      --bg-grad-b: #0c1018;
      --card: #181a25;
      --card-subtle: #141620;
      --fg: #e9eaf2;
      --muted: #9396a8;
      --border: #2a2d3c;
      --field: #11131c;
      --accent: #7d7dff;
      --accent-fg: #0e0f17;
      --accent-soft: #232544;
      --ok: #3ad48f;
      --ok-soft: #12281e;
      --warn: #fbbf24;
      --warn-soft: #2b220d;
      --danger: #f87171;
      --danger-soft: #2e1315;
      --shadow: 0 22px 60px -28px rgba(0, 0, 0, .8);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    color: var(--fg);
    background:
      radial-gradient(1100px 600px at 85% -10%, var(--bg-grad-b), transparent 60%),
      radial-gradient(900px 500px at -10% 0%, var(--bg-grad-a), transparent 55%),
      var(--bg);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    padding: 32px 18px 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap { width: 100%; max-width: 620px; }
  header { text-align: center; margin-bottom: 20px; }
  .logo {
    display: inline-flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 1.55rem; letter-spacing: -.02em;
  }
  .logo .dot {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #9a6bff);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 1rem; box-shadow: 0 6px 16px -6px var(--accent);
  }
  header p { color: var(--muted); font-size: .92rem; margin: 8px 0 0; }

  /* Segmented Control Tabs */
  .tabs {
    display: flex;
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 20px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    background: transparent;
    border: none;
    border-radius: 10px;
    padding: 9px 14px;
    font: inherit;
    font-weight: 600;
    font-size: .92rem;
    color: var(--muted);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all .18s ease;
  }
  .tab-btn:hover { color: var(--fg); }
  .tab-btn.active {
    background: var(--card);
    color: var(--fg);
    box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
  }
  .badge-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 18px;
    height: 18px;
    padding: 0 6px;
    border-radius: 9px;
    font-size: .75rem;
    font-weight: 700;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .tab-btn.active .badge-count {
    background: var(--accent);
    color: #fff;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .hidden { display: none !important; }

  .field { margin-bottom: 18px; }
  .field-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 7px;
  }
  .field-links {
    display: inline-flex;
    gap: 12px;
  }
  .btn-link {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    font-size: .82rem;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .btn-link:hover { opacity: .8; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 7px; }
  label .opt { color: var(--muted); font-weight: 400; font-size: .82rem; }
  textarea, input[type=text], input[type=url], input[type=date], input[type=number], select {
    width: 100%; font: inherit; color: var(--fg);
    background: var(--field);
    border: 1px solid var(--border); border-radius: 11px;
    padding: 10px 12px;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 96px; line-height: 1.5; resize: vertical; }
  textarea:focus, input:focus, select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .hint { color: var(--muted); font-size: .8rem; margin: 6px 2px 0; }
  .toggles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 460px) { .toggles { grid-template-columns: 1fr; } }
  .toggle {
    display: flex; align-items: center; gap: 9px;
    border: 1px solid var(--border); border-radius: 11px;
    padding: 10px 12px; cursor: pointer; user-select: none;
    background: var(--field); transition: border-color .15s, background .15s;
  }
  .toggle:hover { border-color: var(--accent); }
  .toggle input { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .toggle span { font-size: .9rem; }
  button.go {
    width: 100%; margin-top: 6px;
    font: inherit; font-weight: 700; font-size: 1rem;
    color: var(--accent-fg);
    background: linear-gradient(135deg, var(--accent), #8a6bff);
    border: none; border-radius: 12px; padding: 13px;
    cursor: pointer; transition: transform .08s, filter .15s;
    box-shadow: 0 12px 26px -12px var(--accent);
  }
  button.go:hover { filter: brightness(1.05); }
  button.go:active { transform: translateY(1px); }
  .result { margin-top: 22px; display: none; }
  .result.show { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .out-wrap { position: relative; }
  #output {
    width: 100%; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .82rem; min-height: 86px; word-break: break-all;
    background: var(--field); color: var(--fg);
  }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .actions a, .actions button {
    flex: 1; text-align: center; text-decoration: none;
    font: inherit; font-weight: 600; font-size: .9rem;
    padding: 10px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--field); color: var(--fg);
    transition: border-color .15s, background .15s;
  }
  .actions a:hover, .actions button:hover { border-color: var(--accent); }
  #copyBtn.copied { color: var(--ok); border-color: var(--ok); }

  /* --- Pane: My Subscriptions Management --- */
  .sub-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .sub-stats {
    font-size: .86rem;
    color: var(--muted);
    line-height: 1.4;
  }
  .sub-stats strong { color: var(--fg); }
  .sub-stats .cost-badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    margin-left: 6px;
    font-size: .8rem;
  }
  .sub-btn-group {
    display: flex;
    gap: 8px;
  }
  .btn-sub-primary {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 8px 14px;
    font: inherit;
    font-size: .86rem;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: filter .15s;
  }
  .btn-sub-primary:hover { filter: brightness(1.1); }
  .btn-sub-secondary {
    background: var(--field);
    color: var(--fg);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 12px;
    font: inherit;
    font-size: .86rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color .15s;
  }
  .btn-sub-secondary:hover { border-color: var(--accent); }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 42px 18px;
    color: var(--muted);
  }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: .8; }
  .empty-state p { margin: 0 0 16px; font-size: .9rem; line-height: 1.6; }

  /* Subscriptions List & Cards */
  .sub-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sub-card {
    background: var(--card-subtle);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color .15s, box-shadow .15s;
    position: relative;
  }
  .sub-card:hover { border-color: var(--accent); }
  .sub-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
  }
  .sub-card-title-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
    flex: 1;
    min-width: 0;
  }
  .sub-card-check {
    width: 17px;
    height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }
  .sub-card-title {
    font-weight: 700;
    font-size: .98rem;
    color: var(--fg);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sub-status-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: .75rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge-ok { background: var(--ok-soft); color: var(--ok); }
  .badge-warn { background: var(--warn-soft); color: var(--warn); }
  .badge-danger { background: var(--danger-soft); color: var(--danger); }
  .badge-gray { background: var(--field); color: var(--muted); border: 1px solid var(--border); }

  .sub-card-actions {
    display: flex;
    gap: 6px;
  }
  .btn-card-action {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--muted);
    font: inherit;
    font-size: .78rem;
    padding: 3px 7px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn-card-action:hover {
    color: var(--fg);
    border-color: var(--border);
    background: var(--card);
  }
  .btn-card-action.del:hover {
    color: var(--danger);
    border-color: var(--danger-soft);
    background: var(--danger-soft);
  }

  .sub-meta-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    font-size: .82rem;
    margin-bottom: 10px;
  }
  .meta-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--fg);
  }
  .meta-item .meta-k { color: var(--muted); }
  .meta-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  .meta-link:hover { text-decoration: underline; }
  .sub-notes {
    font-size: .78rem;
    color: var(--muted);
    background: var(--field);
    border-radius: 6px;
    padding: 6px 10px;
    margin-bottom: 10px;
    line-height: 1.4;
  }

  .sub-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-top: 9px;
    border-top: 1px dashed var(--border);
  }
  .sub-url-box {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: .75rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .sub-url-actions {
    display: flex;
    gap: 6px;
  }
  .btn-mini {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 8px;
    font: inherit;
    font-size: .75rem;
    font-weight: 600;
    color: var(--fg);
    cursor: pointer;
    transition: border-color .15s;
    white-space: nowrap;
  }
  .btn-mini:hover { border-color: var(--accent); }
  .btn-mini.copied { color: var(--ok); border-color: var(--ok); }

  /* Batch action sticky bar in Manage Tab */
  .batch-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 10px 16px;
    margin-top: 16px;
    box-shadow: 0 4px 18px rgba(91, 91, 240, .15);
  }
  .batch-bar span {
    font-weight: 600;
    font-size: .88rem;
  }

  /* --- Modal / Dialog --- */
  dialog {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    color: var(--fg);
    padding: 24px;
    box-shadow: var(--shadow);
    max-width: 520px;
    width: 92vw;
    margin: auto;
  }
  dialog::backdrop {
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(3px);
  }
  .dialog-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .dialog-header h3 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
  }
  .btn-close-dialog {
    background: transparent;
    border: none;
    font-size: 1.4rem;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .btn-close-dialog:hover { color: var(--fg); background: var(--field); }
  .dialog-form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (max-width: 480px) { .dialog-form-grid { grid-template-columns: 1fr; } }
  .col-span-2 { grid-column: span 2; }
  @media (max-width: 480px) { .col-span-2 { grid-column: span 1; } }

  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .dialog-actions button {
    border-radius: 10px;
    padding: 9px 18px;
    font: inherit;
    font-weight: 600;
    font-size: .9rem;
    cursor: pointer;
  }
  .btn-cancel {
    background: var(--field);
    border: 1px solid var(--border);
    color: var(--fg);
  }
  .btn-confirm {
    background: var(--accent);
    border: none;
    color: #fff;
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--fg);
    color: var(--card);
    padding: 8px 18px;
    border-radius: 30px;
    font-size: .86rem;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all .2s ease;
    z-index: 9999;
    box-shadow: 0 4px 16px rgba(0, 0, 0, .2);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  footer {
    text-align: center; color: var(--muted); font-size: .82rem;
    margin-top: 26px; line-height: 1.8;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sep { opacity: .4; margin: 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot">↻</span>subconverter-ng</div>
    <p>订阅链接转换与集中管理，一键生成多端客户端配置</p>
  </header>

  <!-- Segmented Control Tabs -->
  <div class="tabs" role="tablist">
    <button type="button" role="tab" class="tab-btn active" id="tabBtnConvert" aria-selected="true" aria-controls="paneConvert">⚡ 订阅转换</button>
    <button type="button" role="tab" class="tab-btn" id="tabBtnManage" aria-selected="false" aria-controls="paneManage">📋 我的订阅 <span class="badge-count" id="subCountBadge">0</span></button>
  </div>

  <div class="card">
    <!-- PANE 1: Subscription Converter -->
    <div id="paneConvert">
      <form id="form" onsubmit="return false;">
        <div class="field">
          <div class="field-header">
            <label for="urls" style="margin:0">订阅链接 <span class="opt">每行一个，多个会自动合并</span></label>
            <div class="field-links">
              <button type="button" class="btn-link" id="importFromSubsBtn">从订阅库导入</button>
              <button type="button" class="btn-link" id="saveUrlsToSubBtn">存入订阅库</button>
            </div>
          </div>
          <textarea id="urls" placeholder="https://your-airport.com/api/v1/client/subscribe?token=xxx&#10;https://another.com/sub&#10;vless://uuid@example.com:443?type=tcp#节点链接也可直接粘贴"></textarea>
        </div>

        <div class="field">
          <label for="config">外部配置 config <span class="opt">可选 · 留空用服务端默认</span></label>
          <input type="text" id="config" placeholder="https://raw.githubusercontent.com/.../config.ini">
        </div>

        <div class="field">
          <label for="target">目标 target</label>
          <select id="target">
            <option value="clash">clash (Clash.Meta / mihomo)</option>
            <option value="singbox">sing-box</option>
            <option value="surge">surge</option>
            <option value="shadowrocket">shadowrocket</option>
            <option value="quanx">Quantumult X</option>
            <option value="loon">Loon</option>
            <option value="v2ray">v2ray / mixed (base64)</option>
          </select>
        </div>

        <div class="field">
          <label>选项</label>
          <div class="toggles">
            <label class="toggle"><input type="checkbox" id="sort"><span>节点排序</span></label>
            <label class="toggle"><input type="checkbox" id="dedup"><span>节点去重</span></label>
            <label class="toggle"><input type="checkbox" id="udp"><span>强制 UDP</span></label>
            <label class="toggle"><input type="checkbox" id="tfo"><span>TCP Fast Open</span></label>
            <label class="toggle"><input type="checkbox" id="scv"><span>跳过证书校验</span></label>
            <label class="toggle"><input type="checkbox" id="fdn"><span>过滤不兼容节点</span></label>
            <label class="toggle"><input type="checkbox" id="append_type"><span>节点名加类型</span></label>
            <label class="toggle"><input type="checkbox" id="tailscale"><span>Tailscale 直连</span></label>
            <label class="toggle"><input type="checkbox" id="emoji" checked><span>允许 emoji</span></label>
          </div>
        </div>

        <div class="field">
          <label for="proxy">上游代理 proxy <span class="opt">可选 · 本次请求覆盖全局</span></label>
          <input type="text" id="proxy" placeholder="socks5://127.0.0.1:1080">
        </div>

        <div class="field">
          <label for="exclude_protocol">排除协议 exclude_protocol <span class="opt">可选 · 逗号分隔，如 hy2, tuic</span></label>
          <input type="text" id="exclude_protocol" placeholder="hysteria2, tuic">
        </div>

        <button type="submit" class="go" id="genBtn">生成订阅链接</button>
      </form>

      <div class="result" id="result">
        <div class="field" style="margin:0">
          <label>生成的订阅链接</label>
          <div class="out-wrap">
            <textarea id="output" readonly></textarea>
          </div>
          <div class="actions">
            <button type="button" id="copyBtn">复制</button>
            <a id="openLink" href="#" target="_blank" rel="noopener">打开 / 预览</a>
          </div>
          <p class="hint">把上面的链接粘贴到 Clash / mihomo 客户端的「配置 URL」即可。</p>
        </div>
      </div>
    </div>

    <!-- PANE 2: My Subscriptions Management -->
    <div id="paneManage" class="hidden">
      <div class="sub-top-bar">
        <div class="sub-stats" id="subStats">
          已存 <strong>0</strong> 个订阅
        </div>
        <div class="sub-btn-group">
          <button type="button" class="btn-sub-secondary" id="btnOpenBackup">备份 / 恢复</button>
          <button type="button" class="btn-sub-primary" id="btnOpenAddSub">+ 添加订阅</button>
        </div>
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="emptyState">
        <div class="icon">📦</div>
        <p>暂无保存的订阅。<br>点击上方「<strong>+ 添加订阅</strong>」记录到期时间、流量重置日、官网与费用，实现集中管理与一键转换。</p>

<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // --- Toast Notification ---
  var toastTimer = null;
  function showToast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      t.classList.remove('show');
    }, 2200);
  }

  // ==========================================
  // 1. Form Caching & Converter Logic (Tab 1)
  // ==========================================
  var STORE_KEY_FORM = 'subng.form.v1';
  var TEXT_FIELDS = ['urls', 'config', 'target', 'proxy', 'exclude_protocol'];
  var FLAG_FIELDS = ['sort', 'dedup', 'udp', 'tfo', 'scv', 'fdn', 'append_type', 'tailscale', 'emoji'];

  function saveFormState() {
    try {
      var s = {};
      TEXT_FIELDS.forEach(function (k) { s[k] = $(k).value; });
      FLAG_FIELDS.forEach(function (k) { s[k] = $(k).checked; });
      localStorage.setItem(STORE_KEY_FORM, JSON.stringify(s));
    } catch (e) { /* ignore */ }
  }

  function restoreFormState() {
    try {
      var raw = localStorage.getItem(STORE_KEY_FORM);
      if (!raw) { return; }
      var s = JSON.parse(raw);
      TEXT_FIELDS.forEach(function (k) { if (typeof s[k] === 'string') { $(k).value = s[k]; } });
      FLAG_FIELDS.forEach(function (k) { if (typeof s[k] === 'boolean') { $(k).checked = s[k]; } });
    } catch (e) { /* ignore */ }
  }

  restoreFormState();
  TEXT_FIELDS.concat(FLAG_FIELDS).forEach(function (k) {
    var el = $(k);
    el.addEventListener('input', saveFormState);
    el.addEventListener('change', saveFormState);
  });

  function buildURL() {
    var subs = $('urls').value.split('\n')
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });

    var params = ['target=' + ($('target').value || 'clash')];
    if (subs.length) {
      params.push('url=' + encodeURIComponent(subs.join('|')));
    }
    var config = $('config').value.trim();
    if (config) { params.push('config=' + encodeURIComponent(config)); }

    ['sort', 'dedup', 'udp', 'tfo', 'scv', 'fdn', 'append_type', 'tailscale'].forEach(function (k) {
      if ($(k).checked) { params.push(k + '=true'); }
    });
    if (!$('emoji').checked) { params.push('emoji=false'); }

    var proxy = $('proxy').value.trim();
    if (proxy) { params.push('proxy=' + encodeURIComponent(proxy)); }

    var excludeProto = $('exclude_protocol').value.trim();
    if (excludeProto) { params.push('exclude_protocol=' + encodeURIComponent(excludeProto)); }

    return window.location.origin + '/sub?' + params.join('&');
  }

  $('form').addEventListener('submit', function () {
    var subs = $('urls').value.split('\n')
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
    if (!subs.length) {
      $('urls').focus();
      return false;
    }
    var url = buildURL();
    $('output').value = url;
    $('openLink').href = url;
    $('result').classList.add('show');
    $('output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return false;
  });

  $('copyBtn').addEventListener('click', function () {
    var text = $('output').value;
    if (!text) { return; }
    var done = function () {
      var b = $('copyBtn');
      b.textContent = '已复制 ✓';
      b.classList.add('copied');
      setTimeout(function () {
        b.textContent = '复制';
        b.classList.remove('copied');
      }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else {
      fallback();
    }
    function fallback() {
      var ta = $('output');
      ta.removeAttribute('readonly');
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ }
      ta.setAttribute('readonly', '');
    }
  });

  // ==========================================
  // 2. Subscription Management Logic (Tab 2)
  // ==========================================
  var STORE_KEY_SUBS = 'subng.subscriptions.v1';

  function getSubscriptions() {
    try {
      var raw = localStorage.getItem(STORE_KEY_SUBS);
      if (!raw) return [];
      var data = JSON.parse(raw);
      if (Array.isArray(data)) return data;
      if (data && Array.isArray(data.items)) return data.items;
      return [];
    } catch (e) {
      return [];
    }
  }

  function saveSubscriptions(list) {
    try {
      var payload = {
        version: 1,
        updatedAt: Date.now(),
        items: list
      };
      localStorage.setItem(STORE_KEY_SUBS, JSON.stringify(payload));
      renderSubscriptions();
      updateSubCountBadge();
    } catch (e) {
      alert('保存失败：浏览器存储空间不足或被禁用');
    }
  }

  function updateSubCountBadge() {
    var list = getSubscriptions();
    $('subCountBadge').textContent = list.length;
  }
  updateSubCountBadge();

  // Tab switching
  function switchTab(tab) {
    if (tab === 'convert') {
      $('tabBtnConvert').classList.add('active');
      $('tabBtnConvert').setAttribute('aria-selected', 'true');
      $('tabBtnManage').classList.remove('active');
      $('tabBtnManage').setAttribute('aria-selected', 'false');
      $('paneConvert').classList.remove('hidden');
      $('paneManage').classList.add('hidden');
    } else {
      $('tabBtnManage').classList.add('active');
      $('tabBtnManage').setAttribute('aria-selected', 'true');
      $('tabBtnConvert').classList.remove('active');
      $('tabBtnConvert').setAttribute('aria-selected', 'false');
      $('paneManage').classList.remove('hidden');
      $('paneConvert').classList.add('hidden');
      renderSubscriptions();
    }
  }
  $('tabBtnConvert').addEventListener('click', function () { switchTab('convert'); });
  $('tabBtnManage').addEventListener('click', function () { switchTab('manage'); });

  // Calculate days remaining and status badge
  function getExpireStatus(expireDateStr) {
    if (!expireDateStr) {
      return { text: '长期 / 未设', cls: 'badge-gray', label: '长期有效' };
    }
    var target = new Date(expireDateStr + 'T23:59:59');
    var now = new Date();
    var diffMs = target.getTime() - now.getTime();
    var diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    if (diffDays < 0) {
      return { text: '已过期 ' + Math.abs(diffDays) + ' 天', cls: 'badge-danger', label: '已过期' };
    } else if (diffDays <= 7) {
      return { text: '剩余 ' + diffDays + ' 天 (即将到期)', cls: 'badge-warn', label: '即将到期' };
    } else {
      return { text: '剩余 ' + diffDays + ' 天', cls: 'badge-ok', label: '正常' };
    }
  }

  // Format currency and cost
  function formatCost(cost, cycle, currency, customCycle) {
    if (cost === undefined || cost === null || cost === '' || isNaN(Number(cost))) return '';
    var sym = currency === 'USD' ? '$' : currency === 'HKD' ? 'HK$' : currency === 'EUR' ? '€' : currency === 'USDT' ? '₮' : '¥';
    var cycleMap = {
      month: '月',
      quarter: '季',
      half_year: '半年',
      year: '年',
      two_year: '2年',
      once: '一次性'
    };
    if (cycle === 'once') return sym + cost + ' (一次性)';
    var cStr = cycleMap[cycle] || customCycle || '期';
    return sym + cost + ' / ' + cStr;
  }

  // Calculate estimated monthly cost across all items
  function calcMonthlyCost(list) {
    var total = 0;
    var count = 0;
    list.forEach(function (item) {
      var c = parseFloat(item.cost);
      if (isNaN(c) || c <= 0) return;
      var mult = 1;
      switch (item.cycle) {
        case 'month': mult = 1; break;
        case 'quarter': mult = 1 / 3; break;
        case 'half_year': mult = 1 / 6; break;
        case 'year': mult = 1 / 12; break;
        case 'two_year': mult = 1 / 24; break;
        case 'once': mult = 0; break;
        default: mult = 1; break;
      }
      total += c * mult;
      count++;
    });
    return { total: Math.round(total * 100) / 100, count: count };
  }

  // Render subscriptions list
  function renderSubscriptions() {
    var list = getSubscriptions();
    var listEl = $('subList');
    var emptyEl = $('emptyState');
    var batchBar = $('batchBar');
    listEl.innerHTML = '';

    if (list.length === 0) {
      emptyEl.classList.remove('hidden');
      batchBar.classList.add('hidden');
      $('subStats').innerHTML = '暂无已存订阅';
      return;
    }

    emptyEl.classList.add('hidden');

    var selectedCount = 0;
    var monthly = calcMonthlyCost(list);
    var statsHtml = '已存 <strong>' + list.length + '</strong> 个订阅';
    if (monthly.count > 0) {
      statsHtml += '<span class="cost-badge">月均开销约 ¥' + monthly.total.toFixed(2) + '</span>';
    }
    $('subStats').innerHTML = statsHtml;

    list.forEach(function (item) {
      var isEnabled = item.enabled !== false;
      if (isEnabled) selectedCount++;

      var card = document.createElement('div');
      card.className = 'sub-card';
      card.dataset.id = item.id;

      var exp = getExpireStatus(item.expireDate);
      var costStr = formatCost(item.cost, item.cycle, item.currency, item.cycleCustom);

      // Reset day text
      var resetStr = '';
      if (item.resetDay === 'custom' && item.resetCustom) {
        resetStr = item.resetCustom;
      } else if (item.resetDay && item.resetDay !== '') {
        resetStr = '每月 ' + item.resetDay + ' 日重置';
      }

      var metaItems = [];
      if (item.expireDate) {
        metaItems.push('<div class="meta-item"><span class="meta-k">📅 到期:</span> ' + escapeHtml(item.expireDate) + ' (' + exp.text + ')</div>');
      }
      if (resetStr) {
        metaItems.push('<div class="meta-item"><span class="meta-k">🔄 重置:</span> ' + escapeHtml(resetStr) + '</div>');
      }
      if (costStr) {
        metaItems.push('<div class="meta-item"><span class="meta-k">💰 费用:</span> ' + escapeHtml(costStr) + '</div>');
      }
      if (item.website) {
        metaItems.push('<div class="meta-item"><span class="meta-k">🌐 官网:</span> <a href="' + escapeHtml(item.website) + '" target="_blank" rel="noopener noreferrer" class="meta-link">访问官网 ↗</a></div>');
      }

      var notesHtml = item.notes ? '<div class="sub-notes">📝 ' + escapeHtml(item.notes) + '</div>' : '';

      card.innerHTML =
        '<div class="sub-card-header">' +
          '<div class="sub-card-title-wrap">' +
            '<input type="checkbox" class="sub-card-check" ' + (isEnabled ? 'checked' : '') + ' data-action="toggle" title="勾选以参与批量转换">' +
            '<span class="sub-card-title">' + escapeHtml(item.name || '未命名订阅') + '</span>' +
            '<span class="sub-status-badge ' + exp.cls + '">' + exp.text + '</span>' +
          '</div>' +
          '<div class="sub-card-actions">' +
            '<button type="button" class="btn-card-action" data-action="edit">编辑</button>' +
            '<button type="button" class="btn-card-action del" data-action="delete">删除</button>' +
          '</div>' +
        '</div>' +
        (metaItems.length ? '<div class="sub-meta-grid">' + metaItems.join('') + '</div>' : '') +
        notesHtml +
        '<div class="sub-card-footer">' +
          '<span class="sub-url-box" title="' + escapeHtml(item.url) + '">' + escapeHtml(item.url) + '</span>' +
          '<div class="sub-url-actions">' +
            '<button type="button" class="btn-mini" data-action="copy">复制链接</button>' +
            '<button type="button" class="btn-mini" data-action="convert-single">转为配置</button>' +
          '</div>' +
        '</div>';

      listEl.appendChild(card);
    });

    if (selectedCount > 0) {
      batchBar.classList.remove('hidden');
      $('batchSelectedText').textContent = '已选 ' + selectedCount + ' 个订阅';
    } else {
      batchBar.classList.add('hidden');
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Card Event Delegation
  $('subList').addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var card = btn.closest('.sub-card');
    if (!card) return;
    var id = card.dataset.id;
    var action = btn.dataset.action;
    var list = getSubscriptions();
    var item = list.find(function (x) { return x.id === id; });
    if (!item) return;

    if (action === 'toggle') {
      item.enabled = btn.checked;
      saveSubscriptions(list);
    } else if (action === 'delete') {
      if (confirm('确定要删除订阅「' + (item.name || '该订阅') + '」吗？')) {
        var updated = list.filter(function (x) { return x.id !== id; });
        saveSubscriptions(updated);
        showToast('已删除订阅');
      }
    } else if (action === 'edit') {
      openSubDialog(item);
    } else if (action === 'copy') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(item.url).then(function () {
          btn.textContent = '已复制 ✓';
          btn.classList.add('copied');
          setTimeout(function () {
            btn.textContent = '复制链接';
            btn.classList.remove('copied');
          }, 1500);
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = item.url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('链接已复制到剪贴板');
      }
    } else if (action === 'convert-single') {
      $('urls').value = item.url;
      saveFormState();
      switchTab('convert');
      $('genBtn').click();
      showToast('已载入并生成转换');
    }
  });

  // Batch Convert Action
  $('batchConvertBtn').addEventListener('click', function () {
    var list = getSubscriptions();
    var enabledUrls = list.filter(function (x) { return x.enabled !== false; })
      .map(function (x) { return x.url; })
      .filter(function (u) { return u && u.trim().length > 0; });

    if (!enabledUrls.length) {
      alert('请先勾选至少一个订阅');
      return;
    }

    $('urls').value = enabledUrls.join('\n');
    saveFormState();
    switchTab('convert');
    $('genBtn').click();
    showToast('已载入 ' + enabledUrls.length + ' 个订阅并生成转换');
  });

  // Synergy from Convert Tab
  $('importFromSubsBtn').addEventListener('click', function () {
    var list = getSubscriptions();
    var enabledUrls = list.filter(function (x) { return x.enabled !== false; })
      .map(function (x) { return x.url; })
      .filter(function (u) { return u && u.trim().length > 0; });

    if (!enabledUrls.length) {
      if (list.length === 0) {
        if (confirm('订阅库目前为空，是否前往「我的订阅」添加？')) {
          switchTab('manage');
        }
      } else {
        alert('订阅库中没有勾选启用的订阅，请在「我的订阅」中勾选后导入。');
      }
      return;
    }

    $('urls').value = enabledUrls.join('\n');
    saveFormState();
    showToast('已从订阅库导入 ' + enabledUrls.length + ' 条订阅');
  });

  $('saveUrlsToSubBtn').addEventListener('click', function () {
    var raw = $('urls').value.trim();
    if (!raw) {
      alert('请先在上方输入框粘贴订阅链接');
      $('urls').focus();
      return;
    }
    var firstLine = raw.split('\n')[0].trim();
    openSubDialog({
      name: '',
      url: firstLine
    });
  });

  // ==========================================
  // 3. Add / Edit Subscription Dialog
  // ==========================================
  var subDialog = $('subDialog');

  function openSubDialog(item) {
    $('subForm').reset();
    $('subResetCustomField').classList.add('hidden');
    $('subCycleCustomField').classList.add('hidden');

    if (item && item.id) {
      $('subDialogTitle').textContent = '编辑订阅';
      $('subEditId').value = item.id;
      $('subName').value = item.name || '';
      $('subUrl').value = item.url || '';
      $('subWebsite').value = item.website || '';
      $('subExpireDate').value = item.expireDate || '';

      if (item.resetDay === 'custom' || (!isNaN(item.resetDay) && item.resetDay)) {
        $('subResetDay').value = String(item.resetDay);
      } else {
        $('subResetDay').value = item.resetDay || '';
      }
      if ($('subResetDay').value === 'custom') {
        $('subResetCustomField').classList.remove('hidden');
        $('subResetCustom').value = item.resetCustom || '';
      }

      $('subCost').value = (item.cost !== undefined && item.cost !== null) ? item.cost : '';
      $('subCycle').value = item.cycle || 'month';
      if ($('subCycle').value === 'custom') {
        $('subCycleCustomField').classList.remove('hidden');
        $('subCycleCustom').value = item.cycleCustom || '';
      }
      $('subCurrency').value = item.currency || 'CNY';
      $('subNotes').value = item.notes || '';
    } else {
      $('subDialogTitle').textContent = '添加订阅';
      $('subEditId').value = '';
      if (item && item.url) {
        $('subUrl').value = item.url;
      }
      $('subCycle').value = 'month';
      $('subCurrency').value = 'CNY';
    }

    subDialog.showModal();
    $('subName').focus();
  }

  function closeSubDialog() {
    subDialog.close();
  }

  $('btnOpenAddSub').addEventListener('click', function () { openSubDialog(); });
  $('btnEmptyAdd').addEventListener('click', function () { openSubDialog(); });
  $('subDialogClose').addEventListener('click', closeSubDialog);
  $('subDialogCancel').addEventListener('click', closeSubDialog);

  // Light dismiss on backdrop click
  subDialog.addEventListener('click', function (e) {
    if (e.target === subDialog) closeSubDialog();
  });

  $('subResetDay').addEventListener('change', function () {
    if (this.value === 'custom') {
      $('subResetCustomField').classList.remove('hidden');
      $('subResetCustom').focus();
    } else {
      $('subResetCustomField').classList.add('hidden');
    }
  });

  $('subCycle').addEventListener('change', function () {
    if (this.value === 'custom') {
      $('subCycleCustomField').classList.remove('hidden');
      $('subCycleCustom').focus();
    } else {
      $('subCycleCustomField').classList.add('hidden');
    }
  });

  $('subForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('subName').value.trim();
    var url = $('subUrl').value.trim();
    if (!name) {
      $('subName').focus();
      return false;
    }
    if (!url) {
      $('subUrl').focus();
      return false;
    }

    var list = getSubscriptions();
    var editId = $('subEditId').value;
    var now = Date.now();

    var resetVal = $('subResetDay').value;
    var resetCustom = $('subResetCustom').value.trim();
    var cycleVal = $('subCycle').value;
    var cycleCustom = $('subCycleCustom').value.trim();
    var costVal = $('subCost').value.trim();

    if (editId) {
      var item = list.find(function (x) { return x.id === editId; });
      if (item) {
        item.name = name;
        item.url = url;
        item.website = $('subWebsite').value.trim();
        item.expireDate = $('subExpireDate').value;
        item.resetDay = resetVal;
        item.resetCustom = resetVal === 'custom' ? resetCustom : '';
        item.cost = costVal ? parseFloat(costVal) : null;
        item.cycle = cycleVal;
        item.cycleCustom = cycleVal === 'custom' ? cycleCustom : '';
        item.currency = $('subCurrency').value;
        item.notes = $('subNotes').value.trim();
        item.updatedAt = now;
      }
    } else {
      var newItem = {
        id: 'sub_' + now + '_' + Math.random().toString(36).substr(2, 6),
        name: name,
        url: url,
        website: $('subWebsite').value.trim(),
        expireDate: $('subExpireDate').value,
        resetDay: resetVal,
        resetCustom: resetVal === 'custom' ? resetCustom : '',
        cost: costVal ? parseFloat(costVal) : null,
        cycle: cycleVal,
        cycleCustom: cycleVal === 'custom' ? cycleCustom : '',
        currency: $('subCurrency').value,
        notes: $('subNotes').value.trim(),
        enabled: true,
        createdAt: now,
        updatedAt: now
      };
      list.unshift(newItem);
    }

    saveSubscriptions(list);
    closeSubDialog();
    showToast(editId ? '订阅已更新' : '订阅已添加');
    return false;
  });

  // ==========================================
  // 4. Backup & Restore Dialog
  // ==========================================
  var backupDialog = $('backupDialog');

  $('btnOpenBackup').addEventListener('click', function () {
    $('importJsonArea').value = '';
    $('importFileInput').value = '';
    backupDialog.showModal();
  });
  $('backupDialogClose').addEventListener('click', function () { backupDialog.close(); });
  $('backupDialogDone').addEventListener('click', function () { backupDialog.close(); });
  backupDialog.addEventListener('click', function (e) {
    if (e.target === backupDialog) backupDialog.close();
  });

  function getBackupDataString() {
    var data = {
      version: 1,
      exportedAt: new Date().toISOString(),
      items: getSubscriptions()
    };
    return JSON.stringify(data, null, 2);
  }

  $('exportJsonFileBtn').addEventListener('click', function () {
    var str = getBackupDataString();
    var blob = new Blob([str], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var dateStr = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = 'subconverter-ng-subscriptions-' + dateStr + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('备份文件已下载');
  });

  $('copyJsonTextBtn').addEventListener('click', function () {
    var str = getBackupDataString();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(str).then(function () {
        showToast('备份数据已复制到剪贴板');
      });
    } else {
      $('importJsonArea').value = str;
      $('importJsonArea').select();
      document.execCommand('copy');
      showToast('备份数据已复制');
    }
  });

  $('importFileInput').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function (evt) {
      $('importJsonArea').value = evt.target.result;
    };
    reader.readAsText(file);
  });

  $('doImportBtn').addEventListener('click', function () {
    var raw = $('importJsonArea').value.trim();
    if (!raw) {
      alert('请先选择备份文件或粘贴 JSON 数据');
      return;
    }
    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      alert('JSON 格式不正确，解析失败：' + e.message);
      return;
    }

    var incomingItems = [];
    if (Array.isArray(parsed)) {
      incomingItems = parsed;
    } else if (parsed && Array.isArray(parsed.items)) {
      incomingItems = parsed.items;
    } else {
      alert('未识别到有效的订阅数组');
      return;
    }

    var mode = 'merge';
    var radios = document.getElementsByName('importMode');
    for (var i = 0; i < radios.length; i++) {
      if (radios[i].checked) mode = radios[i].value;
    }

    var currentList = getSubscriptions();
    var finalList = [];

    if (mode === 'overwrite') {
      finalList = incomingItems;
    } else {
      // Merge by URL
      finalList = currentList.slice();
      var existingUrls = new Set(currentList.map(function (x) { return x.url; }));
      var addedCount = 0;
      incomingItems.forEach(function (newItem) {
        if (!newItem.url) return;
        if (!existingUrls.has(newItem.url)) {
          if (!newItem.id) {
            newItem.id = 'sub_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
          }
          finalList.push(newItem);
          existingUrls.add(newItem.url);
          addedCount++;
        }
      });
    }

    saveSubscriptions(finalList);
    backupDialog.close();
    showToast('成功导入 ' + incomingItems.length + ' 条订阅记录');
  });

  // Listen for storage events from other tabs
  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY_SUBS) {
      renderSubscriptions();
      updateSubCountBadge();
    }
  });

})();
</script>
</body>
</html>
